<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPTV desktop (CDE) mode assertion</title>
<style>html,body{margin:0;height:100%;background:#04070d}</style>
</head>
<body>
<!-- 官方频道侧栏 stub：让 switchChannel 走智慧屏 Electron 的真实路径
     （无 __lptvBridge → findOfficialButtons 点官方侧栏项），而不是 iframe 的
     play_channel 路径。 -->
<div class="tv-main-con-r-list-left">
  <div data-pid="600001859" class="tvSelect">CCTV-1 综合</div>
  <div data-pid="600001802">CCTV-2 测试</div>
  <div data-pid="600001803">CCTV-3 测试</div>
</div>
<video id="test-video" muted playsinline></video>
<script>
  var _pid = '600001859';
  var _tv = document.getElementById('test-video');
  Object.defineProperty(_tv, 'readyState', { get: function () { return 4; }, configurable: true });
  Object.defineProperty(_tv, 'videoWidth', { get: function () { return 1280; }, configurable: true });
  Object.defineProperty(_tv, 'currentSrc', {
    get: function () { return 'https://ysp.local/tv?pid=' + _pid; }, configurable: true
  });
  try {
    _tv.play = function () { return Promise.resolve(); };
    _tv.pause = function () {};
  } catch (e) {}

  // 官方侧栏项被注入层点击后：更新 currentSrc 并补发换流事件，
  // 模拟真实官方播放器换台（MSE 起播）。
  var _items = document.querySelectorAll('.tv-main-con-r-list-left > div');
  _items.forEach(function (it) {
    it.addEventListener('click', function () {
      _pid = it.getAttribute('data-pid');
      _items.forEach(function (x) { x.classList.remove('tvSelect'); });
      it.classList.add('tvSelect');
      try { _tv.dispatchEvent(new Event('loadedmetadata')); } catch (e) {}
      setTimeout(function () {
        try { _tv.dispatchEvent(new Event('loadeddata')); } catch (e) {}
        try { _tv.dispatchEvent(new Event('playing')); } catch (e) {}
      }, 30);
    });
  });

  window.__LPTV_ENV = { smart: false, container: true, mobile: false };
  // 不设 __lptvBridge → isTv() 走 __LPTV_ENV.smart，switchChannel 走官方侧栏点击。
  var stub = {
    get_channels: function () {
      return Promise.resolve([
        { name: 'CCTV-1 综合', pid: '600001859' },
        { name: 'CCTV-2 测试', pid: '600001802' },
        { name: 'CCTV-3 测试', pid: '600001803' },
        { name: 'CCTV-4 测试', pid: '600001804' }
      ]);
    },
    get_ui_state: function () {
      return Promise.resolve({ ok: true, lastPid: '600001859', fit: 'cover' });
    },
    get_version: function () { return Promise.resolve('1.0.2-test'); },
    get_asset_image: function () { return Promise.resolve({ ok: false, src: '' }); },
    play_channel: function () { return Promise.resolve({ ok: true }); },
    fullscreen_toggle: function () { return Promise.resolve({ ok: true, fullscreen: false }); },
    set_quality: function () { return Promise.resolve({ ok: true }); },
    set_state: function () { return Promise.resolve({ ok: true }); }
  };
  window.lptv = new Proxy(stub, {
    get: function (t, p) {
      if (p in t) return t[p];
      return function () { return Promise.resolve({ ok: true }); };
    }
  });
</script>
<script src="../inject.js"></script>
<script>
(function () {
  var started = Date.now();
  var trace = window.__trace = {};
  function root() { return document.getElementById('lptv-root'); }
  function state() { var r = root(); return r ? r.getAttribute('data-state') : ''; }
  function q(sel) { return document.querySelector(sel); }
  function waitFor(fn, timeout) {
    var t0 = Date.now();
    return new Promise(function (resolve) {
      (function poll() {
        var v = null;
        try { v = fn(); } catch (e) {}
        if (v) return resolve(v);
        if (Date.now() - t0 > (timeout || 5000)) return resolve(null);
        setTimeout(poll, 80);
      })();
    });
  }
  function click(el) {
    if (!el) return false;
    try { el.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: 10, clientY: 10 })); return true; }
    catch (e) { try { el.click(); return true; } catch (e2) { return false; } }
  }
  function finish(pass, extra) {
    trace.elapsed = Date.now() - started;
    trace.pass = !!pass;
    if (extra) trace.extra = extra;
    document.body.dataset.test = JSON.stringify(trace);
    document.body.dataset.pass = pass ? '1' : '0';
  }

  (async function () {
    // 1) 首页加载
    await waitFor(function () { return root() && q('.lv-card[data-pid]'); }, 6000);
    trace.bootState = state();
    trace.homeCards = document.querySelectorAll('.lv-card[data-pid]').length;
    trace.settingsBtn = !!q('#lv-settings-btn');
    if (trace.bootState !== 'home' || !trace.homeCards || !trace.settingsBtn) {
      return finish(false, 'boot');
    }

    // 2) 设置弹窗 + 标签点击
    click(q('#lv-settings-btn'));
    await waitFor(function () { var s = q('#lptv-settings'); return s && s.classList.contains('open'); }, 2000);
    trace.settingsOpen = !!(q('#lptv-settings') && q('#lptv-settings').classList.contains('open'));
    trace.panePlay = !!(q('#lptv-pane-play') && q('#lptv-pane-play').classList.contains('on'));
    click(q('.lv-set-tab[data-tab="keys"]'));
    await waitFor(function () { return q('#lptv-pane-keys') && q('#lptv-pane-keys').classList.contains('on'); }, 2000);
    trace.paneKeys = !!(q('#lptv-pane-keys') && q('#lptv-pane-keys').classList.contains('on'));
    click(q('.lv-set-tab[data-tab="about"]'));
    await waitFor(function () { return q('#lptv-pane-about') && q('#lptv-pane-about').classList.contains('on'); }, 2000);
    trace.paneAbout = !!(q('#lptv-pane-about') && q('#lptv-pane-about').classList.contains('on'));
    // Esc 关闭
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await waitFor(function () { var s = q('#lptv-settings'); return s && !s.classList.contains('open'); }, 2000);
    trace.settingsClosed = !(q('#lptv-settings') && q('#lptv-settings').classList.contains('open'));
    if (!trace.settingsOpen || !trace.panePlay || !trace.paneKeys || !trace.paneAbout || !trace.settingsClosed) {
      return finish(false, 'settings');
    }

    // 3) 频道面板 → 点击频道 → 切台
    click(q('#lv-b-ch'));
    await waitFor(function () { return state() === 'leftPanel'; }, 2000);
    trace.leftPanel = state();
    var item = q('.lv-left-item[data-pid="600001802"]');
    trace.leftItem = !!item;
    click(item);
    await waitFor(function () { return state() === 'playing' && window.__lptv && window.__lptv.currentPid === '600001802'; }, 8000);
    trace.afterChannel = state();
    trace.pidAfterChannel = window.__lptv ? window.__lptv.currentPid : '';
    if (trace.leftPanel !== 'leftPanel' || !trace.leftItem || trace.afterChannel !== 'playing' || trace.pidAfterChannel !== '600001802') {
      return finish(false, 'channel');
    }

    // 4) 首页按钮 → 首页 → 点击卡片 → 播放
    click(q('#lv-b-home'));
    await waitFor(function () { return state() === 'home'; }, 2000);
    trace.afterHome = state();
    var card = q('.lv-card[data-pid="600001803"]');
    trace.homeCard = !!card;
    click(card);
    await waitFor(function () { return state() === 'playing' && window.__lptv && window.__lptv.currentPid === '600001803'; }, 8000);
    trace.afterCard = state();
    trace.pidAfterCard = window.__lptv ? window.__lptv.currentPid : '';
    if (trace.afterHome !== 'home' || !trace.homeCard || trace.afterCard !== 'playing' || trace.pidAfterCard !== '600001803') {
      return finish(false, 'home/card');
    }

    // 5) 播放页控件：频道/首页/节目单按钮存在
    trace.playButtons = {
      ch: !!q('#lv-b-ch'), home: !!q('#lv-b-home'), epg: !!q('#lv-b-epg'), vol: !!q('#lv-b-vol')
    };
    var ok = trace.playButtons.ch && trace.playButtons.home && trace.playButtons.epg && trace.playButtons.vol;
    finish(ok, ok ? 'ok' : 'play-buttons');
  })();
})();
</script>
</body>
</html>
