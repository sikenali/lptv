ext_config:
  enable_clientfs_access: true
  enable_document_access: true
  enable_media_access: true
application:
  multi_instance: true
  subdomain: lptv
  gpu_accel: true
  file_handler:
    mime:
      - text/html
      - x-lzc-extension/htm
      - x-lzc-extension/html
      - text/html;charset=utf-8
      - text/html; charset=utf-8
#      - application/x-mimearchive
#      - application/xml
#      - application/xhtml+xml
      - application/pdf
    actions:
      open: /?r&file=%u
  entries:
    - id: open
      title: Open
      path: /?r
    - id: setting
      title: Setting
      path: /?setting
  public_path:
    - /catlink/
    - /rim/
  health_check:
    disable: true
  routes:
    #@build if env.DEV_MODE!=1
    - /=file:///lzcapp/pkg/content/web/
    #@build end
    - /catlink/=http://cde:7890/
    - /rim/=http://cde:8888/
    - /d/=http://cde:8888/debug/catlink-file/
  #@build if env.DEV_MODE=1
  injects:
    - id: frontend-dev-proxy
      on: request
      auth_required: false
      when:
        - /*
      unless:
        - /catlink/*
        - /d/*
        - /rim/*
      do:
        - src: |
            const devPort = 5173;
            const contentType = "text/html; charset=utf-8";
            /* ctx.headers.set("X-Debug-Dev-ID", ctx.dev.id || "");
            ctx.headers.set("X-Debug-Dev-Online", String(ctx.dev.online()));
            ctx.response.send(200, "test", { content_type: contentType });
            return; */

            function renderDevPage(title, subtitle, steps) {
              const items = steps.map(function (step) {
                return "<li>" + step + "</li>";
              }).join("");
              return [
                "<!doctype html>",
                "<html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Frontend Dev</title></head>",
                "<body><h1>", title, "</h1><p>", subtitle, "</p><div>Expected local port: ", String(devPort), "</div><ol>", items, "</ol></body></html>",
              ].join("");
            }

            if (!ctx.dev.id) {
              ctx.response.send(200, renderDevPage(
                "Dev machine is not linked yet",
                "This app is waiting for a frontend dev server from the machine that runs lzc-cli project deploy.",
                [
                  "Run <code>lzc-cli project deploy</code> on your dev machine.",
                  "Start your local dev server with <code>npm run dev</code>.",
                  "Refresh this page after port <code>" + String(devPort) + "</code> is ready.",
                ]
              ), { content_type: contentType });
              return;
            }

            const via = ctx.net.via.client(ctx.dev.id);
            if (!ctx.dev.online()) {
              ctx.response.send(200, renderDevPage(
                "Dev machine is offline",
                "The linked dev machine is not reachable right now.",
                [
                  "Bring the dev machine online.",
                  "Start your local dev server with <code>npm run dev</code>.",
                  "Refresh this page after port <code>" + String(devPort) + "</code> is ready.",
                ]
              ), { content_type: contentType });
              return;
            }

            if (!ctx.net.reachable("tcp", "127.0.0.1", devPort, via)) {
              ctx.response.send(200, renderDevPage(
                "Frontend dev server is not ready",
                "This app is running in dev mode and will proxy requests to your linked dev machine.",
                [
                  "Start your local dev server with <code>npm run dev</code>.",
                  "Make sure the dev server listens on port <code>" + String(devPort) + "</code>.",
                  "Refresh this page after the server is ready.",
                ]
              ), { content_type: contentType });
              return;
            }

            ctx.proxy.to("http://127.0.0.1:" + String(devPort), {
              via: via,
              use_target_host: true,
            });
    #    - id: backend-forward-proxy
    #      on: request
    #      auth_required: false
    #      when:
    #        - /catlink/*
    #        - /rim/*
    #        - /d/*
    #      do:
    #        - src: |
    #            const remote = "https://rwx.xuweicat.heiyu.space";
    #            const via = ctx.net.via.client(ctx.dev.id);
    #            ctx.proxy.to(remote, {
    #              via: via,
    #              use_target_host: true,
    #            });
    - id: backend-forward-proxy-catlink
      on: request
      auth_required: false
      when:
        - /catlink/*
      do:
        - src: |
            const remote = "https://rwx.xuweicat.heiyu.space";
            const via = ctx.net.via.client(ctx.dev.id);
            ctx.proxy.to(remote, {
              via: via,
              use_target_host: true,
              path: "/catlink" + ctx.request.path,
            });
    - id: backend-forward-proxy-rim
      on: request
      auth_required: false
      when:
        - /rim/*
      do:
        - src: |
            const remote = "https://rwx.xuweicat.heiyu.space";
            const via = ctx.net.via.client(ctx.dev.id);
            ctx.proxy.to(remote, {
              via: via,
              use_target_host: true,
              path: "/rim" + ctx.request.path,
            });
#@build end
services:
  cde:
    image: registry.lazycat.cloud/snyh/lzc-cde:0.2.9
#    shm_size: 2g
    command: /lzcapp/pkg/content/run.sh
    environment:
      - HOME=/lzcapp/var/
      - CATLINK_APP_ID=rlptv
#      - LC_NAME=${LC_NAME}
    binds:
      - /lzcapp/var/fonts:/usr/local/share/fonts/ex_fonts
#    run_as: 1000
