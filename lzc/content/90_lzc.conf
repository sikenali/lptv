start-env=GTK_IM_MODULE=ibus
start-env=QT_IM_MODULE=ibus
start-env=XMODIFIERS="@im=xim"

input-method=none

system-tray=no

# debug=window,geometry,metadata,x11,events
# debug=screen,geometry,window,pointer,x11

audio=yes
speaker=on
microphone=off
pulseaudio=yes

# 必须在其他应用启动之前启动，因为ibus之类的服务是rim启动的
# 但rim本身又依赖xpra启动的session dbus地址，所以不能在xpra之前启动
# rim日志级别由 /lzcapp/var/.config/rim.json 控制，默认warn，开启服务端插件调试时为debug。
# start-env=GOLOG_LOG_LEVEL=warn
# start-env=GOLOG_OUTPUT=file
# start-env=GOLOG_FILE=/tmp/catlink/rim.log
start=/lzcapp/pkg/content/rim

# start-after-connect=xterm

start-child-after-connect=/lzcapp/pkg/content/launch_lptv.sh

exit-with-children=yes
terminate-children=yes

# 质量阈值：>=80 时 xpra 的视频区选 YUV444P，Intel VAAPI 硬编码器只支持
# YUV420P/NV12，被迫回落软件 x264，8 核跑不动 720p@60 导致掉帧。
# 降到 70 (<80) 会用 YUV420P，从而启用盒子的 VAAPI 硬件 H.264 编码，
# 帧率大幅提升（已实测 vaapih264enc 在本盒子可用）。
quality=70

systemd-run=no

mdns=no

printing=no

bandwidth-limit=500Mbps

# refresh-rate=60

html=no

# 强制 VAAPI 硬编码器（而非 "all" 自动选择）：杜绝 xpra 挑到软件 x264 导致
# 720p@60 掉帧。vaapih264enc 本盒子已实测可用，YUV420P 与其兼容。
video-encoders = vaapih264enc

csc-modules = libyuv


# 禁用brotli, 客户端未携带这个编码，偶发服务器会使用brotli导致客户端panic
compressors = lz4,none
packet-encoders = rencodeplus, none

#xvfb=Xvfb
# Xdummy 在多显示器时能够在日志打印出几个 DUMMY0、DUMMY1 而不是一整块画布，也是 xpra 主力支持
xvfb=Xdummy
# /usr/bin/Xorg -novtswitch -logfile ${XPRA_SESSION_DIR}/Xorg.log -configdir ${XPRA_SESSION_DIR}/xorg.conf.d/$PID -config /etc/xpra/xorg.conf +extension Composite +extension GLX +extension RANDR +extension RENDER -extension DOUBLE-BUFFER -nolisten tcp -noreset -auth $XAUTHORITY -fakescreenfps 60
