# LPTV 远程应用清单（对标 cloud.lazycat.catlink.chrome.lpk）
# 懒猫盒子上跑一个容器，容器里跑 LPTV（pywebview + 真 Chrome/CDP 后端的央视频壳），
# Xpra seamless 抓它的 X11 窗口 → 编码 → WebSocket，浏览器端用 catlink SPA 看/控。
#
# 为什么必须自带真 Chrome：pywebview 在 Linux 上只有 qt(QtWebEngine)/gtk(WebKit2)
# 两个后端，两者都没有 H.264 解码能力，央视频的 H.264/MSE 直播在其上必然黑屏。
# 所以 content/appimage/ 下同时装了真 Chrome 与 LPTV，由 launch_lptv.sh 串起来。
ext_config:
  enable_clientfs_access: true
  enable_document_access: true
  enable_media_access: true

application:
  multi_instance: true
  subdomain: lptv
  gpu_accel: true
  public_path:
    - /catlink/
    - /rim/
  health_check:
    disable: true
  routes:
    - /=file:///lzcapp/pkg/content/web/
    - /catlink/=http://cde:7890/
    - /rim/=http://cde:8888/
    - /d/=http://cde:8888/debug/catlink-file/

services:
  cde:
    image: registry.lazycat.cloud/snyh/lzc-cde:0.2.9
    command: /lzcapp/pkg/content/run.sh
    environment:
      - HOME=/lzcapp/var/
      # 注意：会话层 rim 只接受 rwx/rwps/rchrome 三个 id（rim/app_id.go 硬校验），
      # rlptv 这类自定义值会让 rim 直接退出，浏览器侧输入/截图全挂。subdomain 可以自定义。
      - CATLINK_APP_ID=rchrome
    binds:
      - /lzcapp/var/fonts:/usr/local/share/fonts/ex_fonts
