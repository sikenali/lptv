package: cloud.lazycat.catlink.lptv
version: 0.1.9
name: 懒猫微视
min_os_version: v1.4.3
unsupported_platforms:
  - android
  - ios
  - tvos
locales:
  zh:
    name: 懒猫微视
    description: 懒猫微视客户端
    entries.open.title: 打开
    entries.setting.title: 设置
  en:
    name: LPTV
    description: LPTV — TV client
    entries.open.title: Open
    entries.setting.title: Settings
permissions:
  required:
    - lzcapp.stop_inhibit
  optional:
    - net.internet
    - net.lan
    - document.read
    - document.write
    - media.read
    - media.write
    - power.shutdown.inhibit
    - user.notify
