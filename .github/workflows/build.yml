# ---------------------------------------------------------------------------
# GitHub Actions 流水线
#
# 三路产物：
#   Linux  → LPTV-linux-x64-*.AppImage + cloud.lazycat.catlink.lptv-*.lpk
#   Android→ lptv-*.apk (Capacitor WebView + 官方YSP iframe)
#
# 流程：
#   linux-build   : AppImage + LPK（需要下载骨架 ~32MB）
#   android-build : 构建 APK（无需骨架）
#   release       : 手动触发时合并三路产物创建 GitHub Release
#
# APK 方案说明：
#   Capacitor WebView + bridge.js。桥接层读取 bundles/channels.json 和
#   bundles/logos/{pid}.webp，注入 window.lptv API，inject.js 正常运行。
#   index.html 用 iframe 加载YSP播放页，#lptv-root 覆盖层承载 UI。
# ---------------------------------------------------------------------------
name: Build AppImage LPK & APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1）'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  JDK_VERSION:  '17'
  ANDROID_SDK_VERSION: 'commandlinetools-linux-11076708_latest'
  SKELETON_RELEASE_TAG: 'skeleton-v1'
  SKELETON_ASSET: 'lzc-skeleton.tar.gz'

jobs:
  # ==================================================================
  # Linux：AppImage + LPK
  # ==================================================================
  linux-build:
    name: Linux (AppImage + LPK)
    runs-on: ubuntu-22.04
    outputs:
      appimage_path: ${{ steps.verify-appimage.outputs.path }}
      lpk_path:      ${{ steps.assemble-lpk.outputs.path }}
      version:       ${{ steps.version.outputs.v }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 环境 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libasound2 libatk1.0-0 \
            libcups2 libxss1 libdrm2 libgbm1 libxkbcommon0 \
            libnotify-bin

      # ---- 版本（支持手动覆盖）----
      - name: Get version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          DEFAULT_VERSION="$(node -p "require('./electron/package.json').version")"
          VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
          echo "v=$VERSION" >> $GITHUB_OUTPUT
          # 同步版本号到所有构建文件
          node tools/set_version.js "$VERSION"
          echo "Version: $VERSION (default=$DEFAULT_VERSION)"

      # ---- AppImage ----
      - name: Build AppImage
        run: |
          cd electron
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run dist
      - name: Verify AppImage
        id: verify-appimage
        run: |
          FILE=$(ls electron/dist/LPTV-*.AppImage 2>/dev/null | head -1)
          [ -n "$FILE" ] || { echo "错误：未找到 AppImage" >&2; exit 1; }
          chmod +x "$FILE"
          echo "path=$(pwd)/$FILE" >> $GITHUB_OUTPUT
          echo "AppImage: $(basename "$FILE") ($(du -h "$FILE" | cut -f1))"

      # ---- 下载骨架 ----
      - name: Download skeleton
        id: skeleton
        run: |
          SKELETON_DIR="$(pwd)/lzc/skeleton"
          TARBALL="/tmp/lzc-skeleton.tar.gz"
          TAG="${{ env.SKELETON_RELEASE_TAG }}"
          if gh release view "$TAG" --json assets \
              -q '.assets[] | select(.name=="${{ env.SKELETON_ASSET }}")' 2>/dev/null \
              | grep -q .; then
            gh release download "$TAG" -D /tmp -A '${{ env.SKELETON_ASSET }}'
            mkdir -p "$SKELETON_DIR"
            tar -xzf "$TARBALL" -C "$SKELETON_DIR"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "警告：未找到骨架 Release $TAG，LPK 将降级为纯内容模式" >&2
          fi

      # ---- LPK ----
      - name: Assemble LPK
        id: assemble-lpk
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.v }}"
          APP="${{ steps.verify-appimage.outputs.path }}"
          [ -f "$APP" ] || { echo "AppImage 缺失" >&2; exit 1; }

          SKELETON_DIR="$(pwd)/lzc/skeleton"
          if [ "${{ steps.skeleton.outputs.found }}" = "true" ] \
             && [ -f "$SKELETON_DIR/cde-supervisor" ] && [ -f "$SKELETON_DIR/rim" ]; then
            export LZC_SKELETON="$SKELETON_DIR"
            echo "使用本地骨架"
          fi
          export APP
          bash lzc/content/assemble_lpk.sh

          OUT="$(pwd)/lzc/cloud.lazycat.catlink.lptv-${VERSION}.lpk"
          [ -f "$OUT" ] || { echo "LPK 未生成" >&2; exit 1; }
          echo "path=$OUT" >> $GITHUB_OUTPUT
          ls -lh "$OUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lptv-linux
          path: |
            ${{ steps.verify-appimage.outputs.path }}
            ${{ steps.assemble-lpk.outputs.path }}
          retention-days: 7

  # ==================================================================
  # Windows：单文件 portable exe（双击即用、免安装）
  # ==================================================================
  windows-build:
    name: Windows (portable exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      exe_path: ${{ steps.verify-exe.outputs.path }}
      version:  ${{ steps.version.outputs.v }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 环境 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- 版本（与 linux/android 保持一致）----
      - name: Get version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          DEFAULT_VERSION="$(node -p "require('./electron/package.json').version")"
          VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
          echo "v=$VERSION" >> $GITHUB_OUTPUT
          node tools/set_version.js "$VERSION"
          echo "Version: $VERSION (default=$DEFAULT_VERSION)"

      # ---- 构建 portable exe（原生 Windows，无需 wine）----
      - name: Build portable exe
        run: |
          cd electron
          npm ci --ignore-scripts || npm install --ignore-scripts
          npx electron-builder --win portable
      - name: Verify exe
        id: verify-exe
        run: |
          FILE=$(ls electron/dist/LPTV-*-portable.exe 2>/dev/null | head -1)
          [ -n "$FILE" ] || { echo "错误：未找到 portable exe" >&2; exit 1; }
          echo "path=$(cygpath -w "$(pwd)/$FILE")" >> $GITHUB_OUTPUT
          echo "exe: $(basename "$FILE") ($(du -h "$FILE" | cut -f1))"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lptv-windows
          path: ${{ steps.verify-exe.outputs.path }}
          retention-days: 7

  # ==================================================================
  # Android：APK
  # ==================================================================
  android-build:
    name: Android (APK)
    runs-on: ubuntu-22.04
    outputs:
      apk_path: ${{ steps.assemble-apk.outputs.path }}
      version:  ${{ steps.version.outputs.v }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 环境：Node + JDK + Android SDK ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup JDK
        id: java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: temurin
      - name: Setup Android SDK
        run: |
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR"
          curl -sL "https://dl.google.com/android/repository/${{ env.ANDROID_SDK_VERSION }}.zip" \
            -o /tmp/cmdline-tools.zip
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools/latest/.."
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          export ANDROID_HOME="$SDK_DIR"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
                    "platform-tools" --sdk_root="$SDK_DIR" --no_history 2>&1 | tail -5
          # 写入 GITHUB_ENV 供后续步骤使用
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          # setup-java 设置了 JAVA_HOME，但 build.sh 需要它
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # ---- 版本（支持手动覆盖）----
      - name: Get version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          DEFAULT_VERSION="$(node -p "require('./electron/package.json').version")"
          VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
          echo "v=$VERSION" >> $GITHUB_OUTPUT
          # 同步版本号到所有构建文件
          node tools/set_version.js "$VERSION"
          echo "Version: $VERSION (default=$DEFAULT_VERSION)"

      # ---- 构建 APK ----
      # build.sh 输出到 android/LPTV-{abi}-{ver}-{type}.apk
      - name: Build APK
        id: assemble-apk
        run: |
          export JAVA_HOME="${{ steps.java.outputs.java-home }}"
          export ANDROID_HOME="${{ env.ANDROID_HOME }}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$JAVA_HOME/bin:$PATH"
          bash android/build.sh
          # build.sh 已将 APK 复制到 android/LPTV-{abi}-{ver}-{type}.apk
          APK=$(ls android/LPTV-*-*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "错误：APK 未生成，检查 android/build.sh 输出" >&2; exit 1; }
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $(basename "$APK") ($(du -h "$APK" | cut -f1))"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: lptv-android
          path: ${{ steps.assemble-apk.outputs.path }}
          retention-days: 7

  # ==================================================================
  # Release（仅 workflow_dispatch + 有版本号）
  # ==================================================================
  release:
    name: GitHub Release
    needs: [linux-build, android-build, windows-build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: lptv-linux
          path: release-linux
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: lptv-android
          path: release-android
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lptv-windows
          path: release-windows
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: LPTV v${{ github.event.inputs.version }}
          files: |
            release-linux/LPTV-linux-x64-*.AppImage
            release-linux/cloud.lazycat.catlink.lptv-*.lpk
            release-android/LPTV-*-*.apk
            release-windows/LPTV-*-portable.exe
          generate_release_notes: true
